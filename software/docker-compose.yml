services:
  db:
    image: postgres:16-alpine
    env_file: ./web/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, on first init of an empty data volume
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    env_file: ./web/.env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Backend: copy server.js into the container and restart Node
        - action: sync+restart
          path: ./web/server.js
          target: /app/server.js
        # Frontend: automatically rebuild so vite build reruns
        - action: rebuild
          path: ./web/frontend/my-react-app-js
          ignore:
            - node_modules/
            - dist/
        # New dependencies: automatically rebuild
        - action: rebuild
          path: ./web/package.json

  shiny:
    build: ./web/R
    ports:
      - "3838:3838"
    volumes:
      - ./web/R:/srv/shiny-server:ro

volumes:
  pgdata:
